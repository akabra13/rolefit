[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolefit"
version = "0.1.0"
description = "Role vectors and role-fit search over the PitchGraph lake"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pitchgraph @ git+https://github.com/akabra13/football_graph_predictor.git@3b773a1e9166ea1826b7603f27827d74f495d679",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
