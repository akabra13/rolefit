name: Traits

# Stage 1: player traits for every player-team-season, plus the
# pre-registered split-half reliability test (V1). Derived tables go to
# Drive (gdrive:rolefit/traits); nothing is stored locally.

on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Space-separated competition-season keys (blank = every eligible season)"
        required: false
        default: ""

jobs:
  traits:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rolefit (and pitchgraph, its pinned dependency)
        run: pip install -e .

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${GDRIVE_OAUTH_TOKEN}
          root_folder_id = ${GDRIVE_FOLDER_ID}
          EOF

      - name: Pull lake tables from Drive
        run: |
          mkdir -p "$HOME/pitchgraph"
          for t in events matches lineups; do
            rclone copy gdrive:lake/$t "$HOME/pitchgraph/lake/$t" --fast-list -v
          done

      - name: Traits and reliability
        env:
          PITCHGRAPH_DATA: /home/runner/pitchgraph
          KEYS: ${{ inputs.keys }}
        run: |
          python scripts/run_traits.py ${KEYS:+--keys $KEYS}

      - name: Push derived tables to Drive
        if: ${{ inputs.keys == '' }}
        run: rclone copy out gdrive:rolefit/traits --fast-list -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traits-reliability
          path: out/reliability.json
          if-no-files-found: ignore
