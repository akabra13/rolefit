name: Portability and re-ID

# Stage 2: system adjustment, portability (V2) and re-identification (V3),
# from stage 1's tables on Drive. Results go back to gdrive:rolefit/portability.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rolefit (and pitchgraph, its pinned dependency)
        run: pip install -e .

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${GDRIVE_OAUTH_TOKEN}
          root_folder_id = ${GDRIVE_FOLDER_ID}
          EOF

      - name: Pull stage 1 tables from Drive
        run: rclone copy gdrive:rolefit/traits out --fast-list -v

      - name: Portability and re-ID
        run: |
          for g in male female; do
            echo "=== $g ==="
            ROLEFIT_OUT=out/$g python scripts/run_portability.py
          done

      - name: Push results to Drive
        run: rclone copy out gdrive:rolefit/portability --include "**/portability.json" --include "**/reid.json" --include "**/traits_adjusted.parquet" -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-reid
          path: |
            out/*/portability.json
            out/*/reid.json
          if-no-files-found: ignore
