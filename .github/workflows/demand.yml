name: Slot demand

# Stage 3: slot demand profiles and V3b persistence, from stage 1's tables on Drive.

on:
  workflow_dispatch:

jobs:
  demand:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rolefit (and pitchgraph, its pinned dependency)
        run: pip install -e .

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${GDRIVE_OAUTH_TOKEN}
          root_folder_id = ${GDRIVE_FOLDER_ID}
          EOF

      - name: Pull stage 1 tables from Drive
        run: rclone copy gdrive:rolefit/traits out --fast-list -v

      - name: Slot demand
        run: |
          for g in male female; do
            echo "=== $g ==="
            ROLEFIT_OUT=out/$g python scripts/run_demand.py
          done

      - name: Push results to Drive
        run: rclone copy out gdrive:rolefit/demand --include "**/demand.json" --include "**/slot_demand.parquet" -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slot-demand
          path: |
            out/*/demand.json
          if-no-files-found: ignore
